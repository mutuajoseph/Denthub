# Render Blueprint — backend only (the frontend deploys to Vercel).
#
# autoDeploy is OFF: production deploys are triggered by the Release workflow
# (.github/workflows/release.yml) on a vX.Y.Z tag, not by pushes to main — so
# the GitHub Action is the single source of production deploys.
#
# uv manages the Python toolchain: `pip install uv` bootstraps it, then
# `uv sync` provisions Python 3.12+ (per backend/pyproject.toml) and the deps.
#
# Migrations and the demo-data seeds run from startCommand, before uvicorn.
# Render's preDeployCommand is paid-only, and this service is on the free plan,
# so a preDeployCommand here is silently skipped: the service goes live against
# an unmigrated database (the v0.11/v0.12 release 500s on
# `specialists.verification_tier`). The prefix runs before uvicorn, which blocks
# forever; nothing may be chained after it.
#
# One entrypoint does both: `app.scripts.seed_all` migrates once, then runs the
# seeds in dependency order (products -> countries -> listings -> jobs ->
# magazine -> training). Running the six scripts individually migrated seven
# times per deploy (issue #70). The seeds are idempotent, so every start can
# re-run them; a free instance also spins down when idle, so this repeats on the
# next cold start rather than only per deploy.
#
# Migrations are forward-only here: pair every schema change with a deploy step
# that tolerates the old shape (or use `expand -> migrate -> contract` across two
# releases).
services:
  - type: web
    name: denthub-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    branch: main
    autoDeploy: false
    buildCommand: pip install uv && uv sync --frozen
    startCommand: "uv run python -m app.scripts.seed_all && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEV_MODE
        value: "0"
      # Only needed if the browser calls the API cross-origin. With the Vercel
      # /api rewrite (frontend/vercel.json) requests are same-origin, so CORS
      # isn't triggered. Set to your Vercel domain otherwise. Managed in the
      # Render dashboard, not committed here.
      - key: CORS_ORIGINS
        sync: false
      # Signs every HS256 JWT (app/logic/v1/auth.py). Set a real random value in
      # the Render dashboard (sync: false) — do NOT commit it. If it is unset (or
      # left at the public dev default), the app refuses to start in production
      # (see app/config.py). Rotating it invalidates all existing sessions.
      # Generate one with: python -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: JWT_SECRET_KEY
        sync: false
      # Set this in the Render dashboard (sync: false) — do NOT commit a
      # connection string. It must be a real Postgres URL, not SQLite: the free
      # plan's filesystem is ephemeral, so a local .db file is wiped on every
      # deploy and re-seeding would be required each time. See docs/RELEASE.md.
      - key: DATABASE_URL
        sync: false
