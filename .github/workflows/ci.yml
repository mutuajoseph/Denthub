name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python Quality · ruff + mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check app --output-format=github

      - name: Ruff (format)
        run: uv run ruff format --check app

      - name: Mypy (strict)
        run: uv run mypy app

  typescript-quality:
    name: TypeScript Quality · biome + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm --filter frontend exec biome check --reporter=github .

      - name: Type-check + build (tsc + vite)
        run: pnpm --filter frontend build

  database-quality:
    name: Database Quality · sqlfluff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Lints every tracked *.sql file against .sqlfluff (postgres dialect).
      # No SQL in the repo yet, so this is a no-op until the DB layer lands —
      # it activates automatically the moment .sql files are committed.
      - name: Lint SQL (sqlfluff · postgres)
        run: |
          sql_files=$(git ls-files '*.sql')
          if [ -z "$sql_files" ]; then
            echo "No .sql files tracked yet — database quality gate is a no-op until the DB layer lands."
            exit 0
          fi
          echo "Linting SQL files:"
          echo "$sql_files"
          uvx --from 'sqlfluff>=3,<4' sqlfluff lint $sql_files
