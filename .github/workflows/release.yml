name: Release

# Trunk-based, auto on merge. A push to main (a merged PR) cuts a unified
# vX.Y.Z tag + GitHub Release, then deploys that tag to production
# (frontend → Vercel, backend → Render). The bump is derived from the merge
# commit's Conventional Commit type; workflow_dispatch is a manual override.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump (manual override)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # create tags + GitHub Releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag & GitHub Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + all tags

      - name: Guard — releases come from main only
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Release must run on main (got '${GITHUB_REF_NAME}')."
            exit 1
          fi

      - name: Determine bump & next version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          subject=$(git log -1 --format=%s)
          body=$(git log -1 --format=%b)
          echo "HEAD commit: $subject"

          # Escape hatch for auto (merge) releases: skip when the commit says so.
          if [ "$EVENT" = "push" ] && printf '%s\n%s' "$subject" "$body" | grep -qiE '\[skip release\]'; then
            echo "Commit requests [skip release] — no release cut."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Decide the bump.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            bump="$INPUT_BUMP"
          elif printf '%s' "$subject" | grep -qE '^[a-z]+(\([^)]+\))?!:' || printf '%s' "$body" | grep -q 'BREAKING CHANGE'; then
            bump=major
          elif printf '%s' "$subject" | grep -qE '^feat(\([^)]+\))?:'; then
            bump=minor
          else
            bump=patch
          fi
          echo "Bump: $bump"

          # Compute the next version from the latest v* tag.
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          [ -z "$latest" ] && latest="v0.0.0"
          ver="${latest#v}"
          IFS='.' read -r major minor patch <<< "$ver"
          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "Next version: $next (was $latest)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - name: Create tag & GitHub Release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "$next"
          gh release create "$next" --title "$next" --generate-notes --target "$GITHUB_SHA"

  deploy-frontend:
    name: Deploy frontend → Vercel
    needs: tag
    if: needs.tag.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version }} # build the tagged commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping frontend deploy. See docs/RELEASE.md for setup."
            exit 0
          fi
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed $VERSION → $url"

  deploy-backend:
    name: Deploy backend → Render
    needs: tag
    if: needs.tag.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (production)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL not set — skipping backend deploy. See docs/RELEASE.md for setup."
            exit 0
          fi
          # Deploy hook URLs already carry "?key=..."; append the tag ref so
          # Render deploys this exact tag (falls back to the tracked branch HEAD
          # if the provider ignores ref — which equals the tag at release time).
          echo "Triggering Render deploy for $VERSION"
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${VERSION}"
          echo "Render deploy triggered."
